<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta id="dynamic-theme-color" name="theme-color" content="#1D8FE1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta id="dynamic-apple-title" name="apple-mobile-web-app-title" content="Little Seeds">
    <link id="dynamic-manifest" rel="manifest" href="manifest-little.json">
    <link id="dynamic-apple-icon" rel="apple-touch-icon" href="media/lit.png">
    
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var rawSchool = (params.get('colegio') || '').toLowerCase();
            
            var isStandalone = (
                (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
                window.navigator.standalone === true
            );

            var ua = navigator.userAgent || '';
            var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

            // Si es app instalada (Standalone), forzamos el colegio. Si es web, permitimos cambiarlo.
            var forcedSchool = isStandalone ? (rawSchool || 'seeds') : null;
            var activeSchool = forcedSchool || (rawSchool === 'arboleda' ? 'arboleda' : 'seeds');
            var isArb = (activeSchool === 'arboleda');

            window.__SCHOOL_BOOT = {
                forcedSchool: forcedSchool,
                activeSchool: activeSchool,
                isStandalone: isStandalone,
                isIsolatedApp: isStandalone,
                isIOS: isIOS
            };

            // Actualizar metadatos e íconos inmediatamente
            var themeEl = document.getElementById('dynamic-theme-color');
            if (themeEl) themeEl.setAttribute('content', isArb ? '#006A7A' : '#1D8FE1');
            
            var appleTitleEl = document.getElementById('dynamic-apple-title');
            if (appleTitleEl) appleTitleEl.setAttribute('content', isArb ? 'La Arboleda' : 'Little Seeds');
            
            var appleIconEl = document.getElementById('dynamic-apple-icon');
            if (appleIconEl) appleIconEl.setAttribute('href', isArb ? 'media/arb.png' : 'media/lit.png');

            // Asignar el Manifest correcto
            var manifestEl = document.getElementById('dynamic-manifest');
            if (manifestEl) {
                if (isIOS) {
                    if (manifestEl.parentNode) manifestEl.parentNode.removeChild(manifestEl);
                } else {
                    manifestEl.setAttribute('href', isArb ? 'manifest-arboleda.json' : 'manifest-little.json');
                }
            }
        })();
    </script>
    <title>Little Seeds Montessori &amp; Colegio Integral La Arboleda</title>
    
    <style>
        :root {
            --bg-base: #DDF5FA;
            --bg-mesh: radial-gradient(at 0% 0%, rgba(53, 194, 214, 0.55) 0px, transparent 52%), radial-gradient(at 98% 8%, rgba(255, 208, 21, 0.50) 0px, transparent 50%), radial-gradient(at 88% 88%, rgba(244, 100, 154, 0.42) 0px, transparent 52%), radial-gradient(at 8% 85%, rgba(108, 192, 46, 0.45) 0px, transparent 50%), linear-gradient(135deg, #D9F4FA 0%, #EAF9E6 50%, #FFF5D6 100%);
            --header-glass: linear-gradient(110deg, rgba(29, 143, 225, 0.90) 0%, rgba(53, 194, 214, 0.90) 52%, rgba(108, 192, 46, 0.90) 100%);
            --navbar-bg: rgba(24, 38, 66, 0.94);
            --primary: #1D8FE1;
            --secondary: #6CC02E;
            --accent: #FFD015;
            --glass-surface: rgba(255, 255, 255, 0.66);
            --glass-surface-strong: rgba(255, 255, 255, 0.82);
            --glass-highlight: rgba(255, 255, 255, 0.96);
            --glass-outline: rgba(53, 194, 214, 0.42);
            --text-main: #1A2233;
            --text-muted: #3A465E;
            --radius-lg: 24px;
        }

        body.theme-arboleda {
            --bg-base: #DCECE2;
            --bg-mesh: radial-gradient(at 5% 5%, rgba(0, 118, 122, 0.38) 0px, transparent 52%), radial-gradient(at 95% 15%, rgba(253, 193, 1, 0.35) 0px, transparent 48%), radial-gradient(at 85% 90%, rgba(46, 159, 25, 0.35) 0px, transparent 52%), linear-gradient(135deg, #D7ECE7 0%, #E4F2E1 55%, #F7F1D8 100%);
            --header-glass: linear-gradient(110deg, rgba(0, 106, 122, 0.93) 0%, rgba(34, 139, 64, 0.93) 100%);
            --navbar-bg: rgba(18, 38, 32, 0.95);
            --primary: #006A7A;
            --secondary: #2E9F19;
            --accent: #FDC101;
            --glass-surface: rgba(255, 255, 255, 0.70);
            --glass-surface-strong: rgba(255, 255, 255, 0.84);
            --glass-highlight: rgba(255, 255, 255, 0.96);
            --glass-outline: rgba(46, 159, 25, 0.35);
            --text-main: #182622;
            --text-muted: #374B44;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-base);
            background-image: var(--bg-mesh);
            background-attachment: fixed;
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container { max-width: 1180px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 10; }
        .hidden { display: none !important; }
        .brand-nowrap { white-space: nowrap; display: inline-block; }

        .let-l1 { color: #FFD015; } .let-i1 { color: #6CC02E; } .let-t1 { color: #E83F44; }
        .let-t2 { color: #6CC02E; } .let-l2 { color: #1D8FE1; } .let-e1 { color: #FFD015; }
        .let-s1 { color: #1D8FE1; } .let-ee1 { color: #FFD015; } .let-ee2 { color: #6CC02E; }
        .let-d1 { color: #1D8FE1; } .let-ss2 { color: #FFD015; }
        .let-m, .let-n, .let-e2, .let-s4, .let-r { color: #E83F44; }
        .let-o1, .let-t, .let-s3, .let-o2, .let-i2 { color: #1D8FE1; }

        .arb-g { color: #2E9F19; } .arb-t { color: #006A7A; } .arb-y { color: #D99B00; }

        .antesala-overlay {
            position: fixed; inset: 0; z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 20px;
            background: radial-gradient(circle at 14% 18%, rgba(53, 194, 214, 0.50), transparent 46%), radial-gradient(circle at 86% 20%, rgba(255, 208, 21, 0.46), transparent 46%), radial-gradient(circle at 82% 84%, rgba(244, 100, 154, 0.40), transparent 46%), radial-gradient(circle at 18% 82%, rgba(108, 192, 46, 0.44), transparent 46%), linear-gradient(135deg, #E2F6FA 0%, #EFFAE9 50%, #FFF7DC 100%);
        }
        .antesala-glass-panel { background: #fff; padding: 40px 30px; border-radius: 30px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.1); max-width: 600px; width: 100%; }
        .antesala-logos-row { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .antesala-logo-pure img { width: 120px; height: auto; object-fit: contain; }
        .btn-bienvenidos-liquid { background: linear-gradient(120deg, #1D8FE1 0%, #35C2D6 45%, #6CC02E 100%); color: #fff; border: none; padding: 15px 40px; font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer; margin-top: 20px; }

        header { position: sticky; top: 0; z-index: 100; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.14); }
        .banner-top { background: var(--header-glass); padding: 10px 0; border-bottom: 2.5px solid var(--accent); }
        .banner-inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
        .logos-selector { display: flex; gap: 12px; }
        .logo-emblem-card { background: rgba(255, 255, 255, 0.24); border: 2px solid transparent; border-radius: 16px; padding: 5px 10px; height: 60px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; opacity: 0.7; }
        .logo-emblem-card:hover, .logo-emblem-card.is-active { opacity: 1; background: #fff; border-color: var(--accent); }
        .logo-emblem-card img { max-height: 45px; max-width: 80px; }
        
        .header-brand-info { text-align: right; }
        .header-title-custom { background: #fff; padding: 8px 20px; border-radius: 15px; font-weight: bold; font-size: 18px; display: inline-block; }

        .main-navbar { background: var(--navbar-bg); padding: 5px 0; }
        .nav-list { display: flex; justify-content: center; list-style: none; gap: 10px; }
        .nav-btn { background: transparent; border: none; color: #fff; font-weight: bold; padding: 10px 15px; cursor: pointer; border-radius: 10px; }
        .nav-btn.active { background: var(--accent); color: #000; }

        .hero-box { background: #fff; border-radius: 20px; padding: 30px; display: flex; gap: 20px; margin: 20px 0; box-shadow: 0 5px 20px rgba(0,0,0,0.05); align-items: center; }
        .hero-logo-showcase img { max-width: 150px; }
        .btn-main { background: var(--primary); color: #fff; padding: 12px 24px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }

        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
        .card { background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 5px solid var(--primary); }

        .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal-card { background: #fff; padding: 30px; border-radius: 20px; max-width: 500px; width: 100%; text-align: center; }
        
        .app-badge { display: flex; align-items: center; gap: 15px; background: #f8fafc; padding: 15px; border-radius: 15px; margin: 15px 0; border: 1px solid #e2e8f0; text-align: left; }
        .app-badge img { width: 50px; height: 50px; object-fit: contain; }
        
        .btn-install { display: block; width: 100%; padding: 15px; border-radius: 12px; font-weight: bold; font-size: 16px; text-decoration: none; text-align: center; margin-bottom: 10px; cursor: pointer; border: none; }
        .btn-android { background: #16a34a; color: #fff; }
        .btn-ios { background: #1d8fe1; color: #fff; }
        
        @media (max-width: 768px) {
            .hero-box { flex-direction: column; text-align: center; }
            .grid-3 { grid-template-columns: 1fr; }
            .banner-inner { justify-content: center; }
            .header-brand-info { text-align: center; }
            .nav-list { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <div id="antesalaOverlay" class="antesala-overlay">
        <div class="antesala-glass-panel">
            <div class="antesala-logos-row">
                <div class="antesala-logo-pure"><img src="media/lit.png" alt="Little Seeds"></div>
                <div class="antesala-logo-pure"><img src="media/arb.png" alt="La Arboleda"></div>
            </div>
            <h2 style="margin-bottom: 10px;">Formación Integral</h2>
            <p style="color: #666; margin-bottom: 20px;">Desde la Primera Infancia hasta Primaria</p>
            <button id="btnBienvenidos" type="button" class="btn-bienvenidos-liquid">Bienvenidos</button>
        </div>
    </div>

    <header>
        <div class="banner-top">
            <div class="container banner-inner">
                <div class="logos-selector">
                    <div id="selector-seeds" class="logo-emblem-card is-active" onclick="switchInstitution('seeds')">
                        <img src="media/lit.png" alt="Little Seeds">
                    </div>
                    <div id="selector-arboleda" class="logo-emblem-card" onclick="switchInstitution('arboleda')">
                        <img src="media/arb.png" alt="La Arboleda">
                    </div>
                </div>
                <div class="header-brand-info">
                    <div id="header-brand-title" class="header-title-custom"></div>
                </div>
            </div>
        </div>
        <nav class="main-navbar">
            <ul class="nav-list">
                <li><button class="nav-btn active" data-tab="inicio" onclick="switchTab('inicio')">Inicio</button></li>
                <li><button class="nav-btn" data-tab="niveles" onclick="switchTab('niveles')">Niveles</button></li>
                <li><button class="nav-btn" onclick="openAppDownloadModal()" style="color: var(--accent);">📲 Descargar App</button></li>
            </ul>
        </nav>
    </header>

    <main id="tab-inicio" class="tab-content container">
        <div class="hero-box">
            <div id="hero-logo-display" class="hero-logo-showcase"></div>
            <div>
                <h1 id="hero-title"></h1>
                <p id="hero-motto" style="color: var(--primary); font-weight: bold; margin: 10px 0;"></p>
                <p id="hero-description" style="color: #666;"></p>
                <button class="btn-main" style="margin-top: 20px;" onclick="openAppDownloadModal()">📲 Descargar App Independiente</button>
            </div>
        </div>

        <div class="grid-3">
            <div class="card">
                <h3>Misión</h3>
                <p id="mission-text" style="font-size: 14px; color: #555;"></p>
            </div>
            <div class="card">
                <h3>Visión</h3>
                <p id="vision-text" style="font-size: 14px; color: #555;"></p>
            </div>
            <div class="card">
                <h3>Valores</h3>
                <p id="values-text" style="font-size: 14px; color: #555;"></p>
            </div>
        </div>
    </main>

    <section id="tab-niveles" class="tab-content container hidden" style="padding-top: 20px;">
        <h2 id="niveles-heading" style="text-align: center; margin-bottom: 20px;"></h2>
        <div class="grid-3" id="levels-cards-grid"></div>
    </section>

    <!-- MODAL DE DESCARGA -->
    <div id="app-download-modal" class="modal-backdrop hidden">
        <div class="modal-card">
            <button onclick="closeAppDownloadModal()" style="position: absolute; top: 10px; right: 15px; background: none; border: none; font-size: 20px; cursor: pointer;">✕</button>
            <h2 style="margin-bottom: 5px;">Instalar Aplicación</h2>
            <p style="color: #666; font-size: 14px; margin-bottom: 20px;">Instala la app de tu colegio en tu celular para acceder más rápido.</p>
            
            <div class="app-badge">
                <img id="dl-modal-logo" src="" alt="Logo">
                <div>
                    <div style="font-size: 11px; font-weight: bold; color: var(--primary);">APP INDEPENDIENTE</div>
                    <div id="dl-modal-name" style="font-size: 16px; font-weight: bold;"></div>
                </div>
            </div>

            <div id="dl-modal-buttons">
                <!-- Los botones se inyectan por JS -->
            </div>
            
            <button onclick="closeAppDownloadModal()" style="margin-top: 15px; background: #f1f5f9; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer;">Cancelar</button>
        </div>
    </div>

    <script>
        const BOOT_STATE = window.__SCHOOL_BOOT || { activeSchool: 'seeds', isStandalone: false, isIOS: false };
        const IS_ISOLATED_APP = BOOT_STATE.isStandalone;
        const IS_IOS = BOOT_STATE.isIOS;

        // Ocultar antesala si ya está instalada
        if (IS_ISOLATED_APP) {
            document.getElementById('antesalaOverlay').remove();
            document.body.classList.add('isolated-school-app');
            if (BOOT_STATE.forcedSchool === 'arboleda') document.body.classList.add('app-school-arboleda');
            if (BOOT_STATE.forcedSchool === 'seeds') document.body.classList.add('app-school-seeds');
        } else {
            document.getElementById('btnBienvenidos').addEventListener('click', () => {
                document.getElementById('antesalaOverlay').style.display = 'none';
            });
        }

        // Datos simplificados para el ejemplo (puedes mantener los tuyos completos)
        const INSTITUTIONS_DATA = {
            seeds: {
                name: 'Little Seeds Montessori',
                logo: 'media/lit.png',
                titleHtml: '<span style="color:#FFD015">L</span><span style="color:#6CC02E">i</span><span style="color:#E83F44">t</span><span style="color:#6CC02E">t</span><span style="color:#1D8FE1">l</span><span style="color:#FFD015">e</span> <span style="color:#1D8FE1">S</span><span style="color:#FFD015">e</span><span style="color:#6CC02E">e</span><span style="color:#1D8FE1">d</span><span style="color:#FFD015">s</span>',
                motto: 'Metodología Montessori',
                description: 'Ambiente preparado con calidez para los primeros descubrimientos.',
                mission: 'Brindar un ambiente afectivo y seguro.',
                vision: 'Ser referente en neurodesarrollo infantil.',
                values: 'Respeto, autonomía y empatía.',
                levels: [
                    { name: 'Maternal', desc: 'Estimulación temprana.' },
                    { name: 'Nursery', desc: 'Autonomía y lenguaje.' },
                    { name: 'Pre-kinder', desc: 'Pre-lectoescritura.' }
                ]
            },
            arboleda: {
                name: 'Colegio Integral La Arboleda',
                logo: 'media/arb.png',
                titleHtml: '<span style="color:#2E9F19">A</span><span style="color:#006A7A">r</span><span style="color:#D99B00">b</span><span style="color:#2E9F19">o</span><span style="color:#006A7A">l</span><span style="color:#D99B00">e</span><span style="color:#2E9F19">d</span><span style="color:#006A7A">a</span>',
                motto: 'Sembrando valores, cosechando líderes',
                description: 'Formación académica integral y bilingüismo.',
                mission: 'Formar estudiantes íntegros en Primaria.',
                vision: 'Ser líderes en educación bilingüe.',
                values: 'Integridad, liderazgo y excelencia.',
                levels: [
                    { name: 'Primero Primaria', desc: 'Comprensión lectora y STEAM.' },
                    { name: 'Segundo Primaria', desc: 'Autonomía y liderazgo.' }
                ]
            }
        };

        let activeInstitution = BOOT_STATE.activeSchool;

        function switchInstitution(key) {
            if (BOOT_STATE.forcedSchool && key !== BOOT_STATE.forcedSchool) return;
            
            activeInstitution = key;
            const data = INSTITUTIONS_DATA[key];
            const isArb = key === 'arboleda';

            document.body.classList.toggle('theme-arboleda', isArb);
            document.getElementById('selector-seeds').classList.toggle('is-active', !isArb);
            document.getElementById('selector-arboleda').classList.toggle('is-active', isArb);
            
            document.getElementById('header-brand-title').innerHTML = data.titleHtml;
            document.getElementById('hero-logo-display').innerHTML = `<img src="${data.logo}" style="max-height: 120px;">`;
            document.getElementById('hero-title').innerHTML = data.titleHtml;
            document.getElementById('hero-motto').textContent = data.motto;
            document.getElementById('hero-description').textContent = data.description;
            document.getElementById('mission-text').textContent = data.mission;
            document.getElementById('vision-text').textContent = data.vision;
            document.getElementById('values-text').textContent = data.values;

            document.getElementById('niveles-heading').innerHTML = `Niveles • ${data.titleHtml}`;
            document.getElementById('levels-cards-grid').innerHTML = data.levels.map(l => `
                <div class="card">
                    <h3>${l.name}</h3>
                    <p style="font-size: 14px; color: #555;">${l.desc}</p>
                </div>
            `).join('');

            // Actualizar URL y Manifest en tiempo real para Android
            if (!IS_ISOLATED_APP) {
                const url = new URL(window.location.href);
                url.searchParams.set('colegio', key);
                window.history.replaceState({}, '', url.toString());
                
                if (!IS_IOS) {
                    document.getElementById('dynamic-manifest').setAttribute('href', isArb ? 'manifest-arboleda.json' : 'manifest-little.json');
                }
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.nav-btn[data-tab="${tabId}"]`).classList.add('active');
        }

        // ==========================================
        // LÓGICA DE DESCARGA OPTIMIZADA
        // ==========================================
        function openAppDownloadModal() {
            const data = INSTITUTIONS_DATA[activeInstitution];
            document.getElementById('dl-modal-logo').src = data.logo;
            document.getElementById('dl-modal-name').textContent = data.name;

            const buttonsDiv = document.getElementById('dl-modal-buttons');
            
            // Generar URLs de instalación forzada
            const baseUrl = window.location.origin + window.location.pathname;
            const urlSeeds = `${baseUrl}?colegio=seeds`;
            const urlArboleda = `${baseUrl}?colegio=arboleda`;

            buttonsDiv.innerHTML = `
                <p style="font-size: 13px; color: #444; margin-bottom: 15px;">
                    Para instalar de forma independiente, elige tu colegio:
                </p>
                ${IS_IOS ? `
                    <a href="${urlSeeds}" class="btn-install btn-ios" style="background: ${activeInstitution === 'seeds' ? '#1d8fe1' : '#e2e8f0'}; color: ${activeInstitution === 'seeds' ? '#fff' : '#000'};">
                        1️⃣ Instalar App Little Seeds
                    </a>
                    <a href="${urlArboleda}" class="btn-install btn-ios" style="background: ${activeInstitution === 'arboleda' ? '#1d8fe1' : '#e2e8f0'}; color: ${activeInstitution === 'arboleda' ? '#fff' : '#000'};">
                        2️⃣ Instalar App La Arboleda
                    </a>
                    <p style="font-size: 12px; color: #666; margin-top: 10px;">
                        Al tocar un botón, se abrirá la vista de ese colegio. Luego toca <strong>Compartir → Añadir a pantalla de inicio</strong> en Safari.
                    </p>
                ` : `
                    <a href="${urlSeeds}" class="btn-install btn-android" style="background: ${activeInstitution === 'seeds' ? '#16a34a' : '#e2e8f0'}; color: ${activeInstitution === 'seeds' ? '#fff' : '#000'};">
                        1️⃣ Instalar App Little Seeds
                    </a>
                    <a href="${urlArboleda}" class="btn-install btn-android" style="background: ${activeInstitution === 'arboleda' ? '#16a34a' : '#e2e8f0'}; color: ${activeInstitution === 'arboleda' ? '#fff' : '#000'};">
                        2️⃣ Instalar App La Arboleda
                    </a>
                    <p style="font-size: 12px; color: #666; margin-top: 10px;">
                        Al tocar un botón, la página se recargará con la identidad correcta. Toca los <strong>3 puntos de Chrome</strong> y selecciona <strong>"Instalar Aplicación"</strong>.
                    </p>
                `}
            `;

            document.getElementById('app-download-modal').classList.remove('hidden');
        }

        function closeAppDownloadModal() {
            document.getElementById('app-download-modal').classList.add('hidden');
        }

        // Inicialización
        window.addEventListener('DOMContentLoaded', () => {
            switchInstitution(BOOT_STATE.activeSchool);
        });
    </script>
</body>
</html>
